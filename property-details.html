
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details | HAVENSTONE</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
    <nav class="navbar container">

        <a href="index.html" class="logo">
            <span class="logo-name">HAVENSTONE</span>
            <span class="logo-subtitle">REAL ESTATE & PROPERTY CONSULTANTS</span>
        </a>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="properties.html" class="active">Properties</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <a href="contact.html" class="nav-button">List a Property</a>

        <button class="menu-toggle" id="menuToggle"
            aria-label="Open navigation menu"
            aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </nav>
</header>



<main class="property-details-page">

    <section class="property-details-section">

        <div class="property-details-container">

            <div class="property-details-image">
                <img id="detailImage" src="" alt="Property image">
            </div>

            <div class="property-details-info">

                <p id="detailLocation" class="property-location"></p>

                <h1 id="detailTitle"></h1>

                <p id="detailPrice" class="property-price"></p>

                <div class="property-details-features">
                    <span id="detailBedrooms"></span>
                    <span id="detailBathrooms"></span>
                    <span id="detailArea"></span>
                </div>

                <p id="detailDescription"></p>

                <a href="contact.html" class="btn btn-primary">
                    Enquire About This Property
                </a>

            </div>

        </div>

    </section>

</main>



    <!-- Footer will go here -->


    <script src="js/main.js"></script>
</body>
</html>
